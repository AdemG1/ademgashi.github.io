<style>
  #theme-toggle .site-theme-switch {
    position: relative; display: inline-block; flex: 0 0 auto;
    width: 64px; height: 36px; padding: 0; margin: 0;
    border: 2px solid #d9dadd; border-radius: 999px;
    background: #fafafa; color: #30363b; cursor: pointer;
    box-sizing: border-box; vertical-align: middle;
    appearance: none; overflow: hidden;
  }
  #theme-toggle .site-theme-switch::before,
  #theme-toggle .site-theme-switch::after { content: none; }
  #theme-toggle .site-theme-thumb {
    position: absolute; left: 2px; top: 2px; width: 28px; height: 28px;
    display: grid; place-items: center; border-radius: 50%;
    background: #e1e2e5; transform: translateX(0);
    transition: transform 220ms ease, background-color 220ms ease;
    pointer-events: none;
  }
  #theme-toggle .site-theme-thumb svg { width: 21px; height: 21px; }
  #theme-toggle .site-theme-moon, #theme-toggle #theme-icon { display: none; }
  html[data-theme="dark"] #theme-toggle .site-theme-switch {
    background: #25282b; border-color: #42464b; color: #e2e5e9;
  }
  html[data-theme="dark"] #theme-toggle .site-theme-thumb {
    transform: translateX(28px); background: #42464b;
  }
  html[data-theme="dark"] #theme-toggle .site-theme-sun { display: none; }
  html[data-theme="dark"] #theme-toggle .site-theme-moon { display: block; }
  #theme-toggle .site-theme-switch:focus-visible { outline: 2px solid #4a6fa5; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { #theme-toggle .site-theme-thumb { transition: none; } }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const container = document.getElementById("theme-toggle");
  if (!container) return;
  container.innerHTML = '<span class="site-theme-switch" role="switch" tabindex="0" aria-label="Dark mode"><i id="theme-icon" aria-hidden="true"></i><span class="site-theme-thumb" aria-hidden="true"><svg class="site-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg><svg class="site-theme-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg></span></span>';
  const button = container.querySelector(".site-theme-switch");
  button.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      button.click();
    }
  });
  function syncSwitch() {
    const dark = document.documentElement.dataset.theme === "dark";
    button.setAttribute("aria-checked", String(dark));
    button.title = dark ? "Switch to light mode" : "Switch to dark mode";
  }
  syncSwitch();
  new MutationObserver(syncSwitch).observe(document.documentElement, {
    attributes: true, attributeFilter: ["data-theme"]
  });
});
</script>


<style>
  @media (min-width: 1100px) {
    #site-nav .visible-links { margin-left: auto; margin-right: 0; }
    #site-nav .visible-links > .masthead__menu-item--lg {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      padding-right: 0;
    }
    #site-nav .visible-links > .masthead__menu-item--lg a { margin-left: 0; }
    #site-nav #theme-toggle { padding-left: 16px; }
    .brainwise-page .masthead__inner-wrap {
      box-sizing: border-box; width: 100%; max-width: 1380px;
      margin-left: auto; margin-right: auto; padding-left: 44px; padding-right: 44px;
    }
  }
</style>


<style>
  @media (max-width: 1099px) {
    #site-nav .visible-links > #theme-toggle { width: 74px; min-width: 74px; }
    #site-nav #theme-toggle .site-theme-switch {
      position: absolute; right: calc(2.5rem + 10px); top: 50%;
      transform: translateY(-50%);
    }
    #site-nav:has(> button.hidden) #theme-toggle .site-theme-switch { right: 0; }
  }
</style>


<style>
  .author__urls-wrapper .contact-toggle {
    border-radius: 999px; border: 1px solid #1e3a5f !important; background: #1e3a5f;
    color: #fff !important; padding: 10px 15px; min-height: 42px;
    font-weight: 600; line-height: 1; opacity: 1;
    box-shadow: 0 2px 6px #1e3a5f20; cursor: pointer;
    transition: background-color .18s ease, box-shadow .18s ease;
  }
  .author__urls-wrapper .contact-toggle:hover,
  .author__urls-wrapper.open .contact-toggle { background: #2d5079; border-color: #2d5079 !important; color: #fff !important; }
  .author__urls-wrapper .contact-toggle svg { width: 17px; height: 17px; flex: 0 0 auto; vertical-align: middle; }
  .author__urls-wrapper .contact-toggle .contact-chevron { width: 14px; height: 14px; transition: transform .18s ease; }
  .author__urls-wrapper.open .contact-chevron { transform: rotate(180deg); }
  .author__urls-wrapper .contact-toggle:focus-visible { outline: 2px solid #4a6fa5; outline-offset: 4px; }
  html[data-theme="dark"] .author__urls-wrapper .contact-toggle { background: #bcd4f4; border-color: #bcd4f4 !important; color: #10243b !important; box-shadow: 0 2px 8px #0004; }
  html[data-theme="dark"] .author__urls-wrapper .contact-toggle:hover,
  html[data-theme="dark"] .author__urls-wrapper.open .contact-toggle { background: #d8e7fa; border-color: #d8e7fa !important; color: #10243b !important; }
  @media (max-width: 924px) { .author__urls-wrapper .contact-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 8px; } }
  @media (prefers-reduced-motion: reduce) { .author__urls-wrapper .contact-toggle, .author__urls-wrapper .contact-chevron { transition: none; } }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".author__urls-wrapper").forEach(function (wrapper) {
    const toggle = wrapper.querySelector(".contact-toggle");
    if (!toggle) return;
    function syncContact() {
      toggle.setAttribute("aria-expanded", String(wrapper.classList.contains("open")));
    }
    syncContact();
    new MutationObserver(syncContact).observe(wrapper, { attributes: true, attributeFilter: ["class"] });
  });
});
</script>
