{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Restore the Brainwise hero wording shown in the earlier design. -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var hero = document.querySelector(".bw .hero-bw");
  if (!hero) return;

  var title = hero.querySelector("h1");
  if (title) title.innerHTML = 'Brainwise.<br><em>A closer look within.</em>';

  var description = hero.querySelector("p");
  if (description) {
    description.textContent = "Explore the anatomy behind memory, thought, and movement—and the different ways our brains change with age.";
  }

  var edition = hero.querySelector(".edition");
  if (edition) {
    var caption = Array.from(edition.childNodes).find(function (node) {
      return node.nodeType === Node.TEXT_NODE && node.textContent.trim();
    });
    if (caption) caption.textContent = "\n      Four anatomical perspectives · An anatomical explorer\n    ";
  }
});
</script>

<!-- end custom head snippets -->
