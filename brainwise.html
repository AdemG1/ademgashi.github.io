---
layout: null
permalink: /brainwise/
---
{% assign brainwise_version = "2" %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brainwise v{{ brainwise_version }}</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    iframe { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="brainwise-frame" src="{{ '/brainwise-v' | append: brainwise_version | append: '.html' | relative_url }}" title="Brainwise version {{ brainwise_version }} interactive brain explorer"></iframe>
  <script>
    const frame = document.getElementById("brainwise-frame");
    const version = "{{ brainwise_version }}";
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      if (!doc) return;
      const walker = doc.createTreeWalker(doc.body, doc.defaultView.NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue.includes("PRIVATE PREVIEW")) {
          node.nodeValue = node.nodeValue.replace(/PRIVATE PREVIEW.*$/, `BRAINWISE · VERSION ${version} · 2D + OPTIONAL 3D`);
          break;
        }
      }
    });
  </script>
</body>
</html>
